name: Questbook static checks
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/factory_trials.test.cjs tests/events.test.cjs tests/artillery.test.cjs tests/notes.test.cjs tests/tooltips.test.cjs
      - run: python tools/validate.py --report reports/quality-ci.json
      - run: python tools/apply_palettes.py --check
      - run: python tools/backgrounds.py --check
      - run: python tools/ui_textures.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-quality-report
          path: reports/quality-ci.json
