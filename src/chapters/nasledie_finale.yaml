# Акт IV. Финал «Край — конец пути»: сюжетный хребет летописи (ссылки) — Эклунд жив → дракон → Эндер-хранитель → Наследие.
# Сверху — существа пустоты и Червь пустоты (эпилог), снизу — дальние острова: врата, город шалкеров, корабль с крыльями.
chapter:
  filename: nasledie_finale
  id: 3E920F5B7179C5CD
  group: act4
  title: Край — конец пути
  icon: minecraft:end_portal_frame
  order_index: 16
  default_hide_dependency_lines: true
  default_quest_shape: step
  progression_mode: flexible

links:
  - {quest: nasledie_chronicle/eklund_alive, x: 0.0, y: 0.0, shape: milestone, size: 1.5}
  - {quest: nasledie_chronicle/dragon, x: 3.5, y: 0.0, shape: boss, size: 1.8}
  - {quest: nasledie_chronicle/ender_guardian, x: 8.0, y: 0.0, shape: boss, size: 2.0}
  - {quest: nasledie_chronicle/legacy, x: 12.0, y: 0.0, shape: milestone, size: 2.2}

quests:
  # ── Пустота над островами ──
  - key: enter_end
    title: Шаг за рамку
    description:
      - Двенадцать очей встают в рамку, и портал, который Зодчие запирали последним, открывается. Пока жив дракон, обратной дороги нет —
        разве что через смерть. Тыква на голове, кстати, успокаивает эндерменов.
    x: 1.75
    y: -2.75
    icon: minecraft:end_portal_frame
    shape: expedition
    size: 1.2
    deps: [nasledie_chronicle/eklund_alive]
    tasks:
      - {type: advancement, advancement: minecraft:end/root}
    rewards:
      - {type: xp, xp: 300}
      - {type: item, item: minecraft:carved_pumpkin}
      - {type: item, item: minecraft:golden_apple, count: 4}

  - key: spectre
    id: 418BF87D0F99A324
    title: Поводок для спектра
    description:
      - В пустоте между островами плывут спектры — призрачные родичи фантомов. Приманите одного сердцем души из Нижнего мира и накиньте
        поводок — он потащит вас к новым островам.
    x: 0.0
    y: -5.25
    icon: alexsmobs:soul_heart
    optional: true
    deps: [enter_end]
    tasks:
      - type: criteria
        title: Привязать спектра поводком
        criteria:
          leash:
            trigger: minecraft:player_interacted_with_entity
            conditions:
              item: {items: [minecraft:lead]}
              entity: {type: alexsmobs:spectre}
    rewards:
      - {type: xp, xp: 450}
      - {type: item, item: minecraft:ender_pearl, count: 8}
      - {type: item, item: minecraft:lead, count: 2}

  - key: capsid
    title: Капсид эндериофага
    description:
      - По равнинам Края бродят эндериофаги — биомеханические вирусы ростом с человека. С разбитого падает капсид; положите в него рыбу или
        личинку, и он переделает её во что-то странное.
    x: 4.5
    y: -2.75
    icon: alexsmobs:capsid
    deps: [enter_end]
    tasks:
      - {type: criteria, title: Добыть капсид, obtain: alexsmobs:capsid}
    rewards:
      - {type: xp, xp: 350}
      - {type: item, item: minecraft:cod, count: 8}

  - key: ender_flu
    id: 50F2011C089DD095
    title: Эндер-грипп
    description:
      - Эндериофаг кого-то заразил. Максима или Юру — неважно. Лечите хорусом и молоком, и быстро — через десять минут грипп взрывается
        маленькими фагами.
    x: 3.5
    y: -5.25
    icon: minecraft:chorus_fruit
    optional: true
    deps: [capsid]
    tasks:
      - {id: 24355D31B671A4F9, type: advancement, advancement: alexsmobs:alexsmobs/ender_flu}
    rewards:
      - {type: xp, xp: 260}
      - {type: item, item: minecraft:chorus_fruit, count: 16}
      - {type: item, item: farmersdelight:milk_bottle, count: 4}

  - key: cosmaw
    id: 3C2AA39C0E1FDEF8
    title: Рыба? Жук? Космав!
    description:
      - Треска из капсида становится космической, а космавы за неё готовы на всё. Приручите одного — он подхватит хозяина, сорвавшегося
        с края острова.
    x: 7.0
    y: -2.75
    icon: alexsmobs:cosmic_cod
    deps: [capsid]
    tasks:
      - {id: 2E1702787FA1C576, type: advancement, advancement: alexsmobs:alexsmobs/tame_cosmaw}
    rewards:
      - {type: xp, xp: 400}
      - {type: item, item: alexsmobs:cosmic_cod, count: 8}
      - {type: item, item: minecraft:chorus_fruit, count: 8}

  # ── Эпилог: то, что под миром ──
  - key: void_summon
    id: 45769170EBDD1A02
    title: Приманка для пустоты
    description:
      - Личинка багрового комара в капсиде становится загадочным червём. Брошенный в пустоту Края, он позовёт то, что живёт под островами.
        Зодчие закрыли эту дверь — вы её откроете.
    x: 6.25
    y: -5.25
    icon: alexsmobs:mysterious_worm
    shape: trial
    size: 1.3
    deps: [capsid]
    tasks:
      - {id: 4183BD5511A7CAD6, type: advancement, advancement: alexsmobs:alexsmobs/void_worm_summon}
    rewards:
      - {type: xp, xp: 500}
      - {type: item, item: minecraft:potion, nbt: '{Potion:"minecraft:long_slow_falling"}', count: 3}
      - {type: item, item: alexsmobs:enderiophage_rocket, count: 8}

  - key: void_split
    id: 7C9F211F3C3FEE27
    title: Надо было по голове
    description:
      - Ударьте Червя пустоты не в голову, а в тело — и он разделится надвое. Зачем? Чтобы Юра потом рассказывал, что червей было два.
    x: 6.25
    y: -7.75
    icon: alexsmobs:void_worm_mandible
    shape: milestone
    optional: true
    deps: [void_summon]
    tasks:
      - {id: 553932FEAD227C14, type: advancement, advancement: alexsmobs:alexsmobs/void_worm_split}
    rewards:
      - {type: xp, xp: 600}
      - {type: item, item: alexsmobs:void_worm_effigy}

  - key: void_kill
    id: 2DAF49A8C5352825
    title: Червь пустоты
    description:
      - Под миром осталось то, что Зодчие не смогли заковать ни в один сосуд. Оно поднялось на вашу приманку. Уничтожьте его.
    x: 9.0
    y: -5.25
    icon: alexsmobs:void_worm_eye
    shape: boss
    size: 1.8
    deps: [void_summon]
    tasks:
      - {id: 582E89EEE3373184, type: advancement, advancement: alexsmobs:alexsmobs/void_worm_kill}
    rewards:
      - {type: xp, xp: 2500}
      - {type: item, item: alexsmobs:dimensional_carver}
      - type: book
        title: Табличка, найденная в пустоте
        author: Неизвестный Зодчий
        pages:
          - "Мы заковали огонь, море, бурю и смерть. Восемь сосудов на восьми швах.\n\nПустоту под миром заковать было не во что."
          - "Она не сила и не зверь. Она голод. Мы закрыли её островами и надеялись, что никто не бросит ей приманку."
          - "Вы убили то, что поднялось. Голод остался. Его не держат сосуды — только то, что живёт и растёт над ним.\n\nСтройте дальше."

  # ── Печать и дальние острова ──
  - key: respawn
    title: Второй раунд
    description:
      - Четыре кристалла Края на краю портала — и печать встаёт снова. Призовите дракона ещё раз; теперь вы знаете, чего ждать.
    x: 1.75
    y: 2.75
    icon: minecraft:end_crystal
    shape: milestone
    optional: true
    deps: [nasledie_chronicle/dragon]
    tasks:
      - {type: advancement, advancement: minecraft:end/respawn_dragon}
    rewards:
      - {type: xp, xp: 1000}
      - {type: item, item: minecraft:totem_of_undying}
      - {type: item, item: minecraft:dragon_breath, count: 6}

  - key: gateway
    title: Врата к дальним островам
    description:
      - После гибели дракона над островом открываются малые врата. Бросьте в них жемчуг — и окажетесь там, где стоят города и цитадель.
    x: 5.5
    y: 3.0
    icon: minecraft:ender_pearl
    shape: expedition
    size: 1.2
    deps: [nasledie_chronicle/dragon]
    tasks:
      - {type: advancement, advancement: minecraft:end/enter_end_gateway}
    rewards:
      - {type: xp, xp: 400}
      - {type: item, item: minecraft:ender_pearl, count: 16}

  - key: end_city
    title: Город шалкеров
    description:
      - Пурпурные башни выросли здесь без Зодчих — кто-то жил в Краю и до них. Войдите в город и не стойте под пулями шалкеров.
    x: 8.0
    y: 3.0
    icon: minecraft:purpur_block
    size: 1.2
    deps: [gateway]
    tasks:
      - {type: advancement, advancement: minecraft:end/find_end_city}
    rewards:
      - {type: xp, xp: 500}
      - {type: item, item: waystones:return_scroll, count: 3}

  - key: treasure
    title: Сокровищница башни
    description:
      - В верхних комнатах башен стоят сундуки. Откройте хотя бы один — добыча в нём у каждого своя.
    x: 10.5
    y: 3.0
    icon: minecraft:chest
    deps: [end_city]
    tasks:
      - {type: criteria, title: Открыть сундук города Края, loot: minecraft:chests/end_city_treasure}
    rewards:
      - {type: xp, xp: 600}
      - {type: item, item: minecraft:spire_armor_trim_smithing_template}
      - {type: item, item: minecraft:diamond, count: 4}

  - key: elytra
    title: Крылья с корабля
    description:
      - У некоторых городов висит корабль, а на его носу — крылья в рамке. Заберите их — дальше Край станет маленьким.
    x: 10.5
    y: 5.5
    icon: minecraft:elytra
    shape: milestone
    size: 1.5
    deps: [end_city]
    tasks:
      - {type: advancement, advancement: minecraft:end/elytra}
    rewards:
      - {type: xp, xp: 800}
      - {type: item, item: minecraft:firework_rocket, count: 32}
      - {type: item, item: minecraft:phantom_membrane, count: 4}

  - key: levitate
    title: Юра улетел
    description:
      - Пуля шалкера поднимает в воздух. Поднимитесь на пятьдесят блоков — и надейтесь, что под вами окажется остров, а не пустота.
    x: 8.0
    y: 5.5
    icon: minecraft:shulker_shell
    optional: true
    deps: [end_city]
    tasks:
      - {type: advancement, advancement: minecraft:end/levitate}
    rewards:
      - {type: xp, xp: 300}
      - {type: item, item: minecraft:potion, nbt: '{Potion:"minecraft:long_slow_falling"}', count: 2}
      - {type: item, item: farmersdelight:milk_bottle, count: 4}

  - key: shulker_box
    title: Сундук, который летает с тобой
    description:
      - Два панциря шалкера и сундук — и выходит ящик, который не теряет содержимое. Соберите свой склад в кармане для дальних островов.
    x: 5.5
    y: 5.5
    icon: minecraft:purple_shulker_box
    deps: [end_city]
    tasks:
      - type: criteria
        title: Получить ящик шалкера
        obtain: [minecraft:shulker_box, minecraft:white_shulker_box, minecraft:orange_shulker_box, minecraft:magenta_shulker_box,
                 minecraft:light_blue_shulker_box, minecraft:yellow_shulker_box, minecraft:lime_shulker_box, minecraft:pink_shulker_box,
                 minecraft:gray_shulker_box, minecraft:light_gray_shulker_box, minecraft:cyan_shulker_box, minecraft:purple_shulker_box,
                 minecraft:blue_shulker_box, minecraft:brown_shulker_box, minecraft:green_shulker_box, minecraft:red_shulker_box,
                 minecraft:black_shulker_box]
    rewards:
      - {type: xp, xp: 400}
      - {type: item, item: sophisticatedstorage:shulker_box}
