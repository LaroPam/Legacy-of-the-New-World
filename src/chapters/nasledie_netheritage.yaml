  title: Две победы под огнестойкостью
  x: 12.5
  y: 0.0
  icon: minecraft:magma_cream
  shape: shield
  size: 1.5
  optional: true
  description:
  - Убейте ифрита и визер-скелета внутри крепости под действием огнестойкости. В момент убийства и вы, и враг должны
    оставаться внутри сооружения. Подходит крепость YUNG или обычная незерская крепость.
  - Для зелья используйте бутылочку воды, адский нарост и сгусток магмы; редстоун продлевает действие. Сверьтесь
    с внутриигровым рецептом, возьмите запас и выпейте зелье до боя.
  - 'Проверьте две цели в карточке. Огнестойкость помогает против пламени, но не отменяет удары и иссушение: щит
    и путь отхода всё ещё нужны.'
