- id: 060BA736EF32E9F5
  title: Войти в Нижний мир
  x: 0.0
  y: 0.0
  icon: minecraft:obsidian
  shape: scroll
  size: 1.5
  description:
  - Войдите в Нижний мир. Основная цель главы — вернуться в крепость с огнестойкостью и победить под её действием
    ифрита и визер-скелета.
  - 'Сначала найдите крепость и познакомьтесь с обоими противниками. Затем приготовьте зелья: стержень ифрита нужен
    для варки, адский нарост — для основы, сгусток магмы — для огнестойкости.'
  - Два боковых похода ведут через леса и башни к незерскому подземелью и через лавовый порт к замку со снегом.
    Выбирайте их отдельно от основного рейда; золотая броня не защищает от пиглина-брута.
  tasks:
  - id: 051AC61363499F46
    type: dimension
    dimension: minecraft:the_nether
  rewards:
  - id: DFCDD9B037AC95DF
    type: xp
    xp: 100
