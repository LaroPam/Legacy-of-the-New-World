  - key: pulley_maxed
    id: 1310EF94F77C64F4
    title: Спуск глубже двухсот блоков
    description:
      - Растяните верёвочный блок на максимальную длину. Лифт в самую глубокую шахту готов.
    x: -0.5
    y: 6
    icon: create:rope_pulley
    deps: [backtank]
    tasks:
      - {type: advancement, advancement: create:pulley_maxed}
