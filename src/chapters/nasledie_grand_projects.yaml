    title: Максим и Юра передают привет
    description:
      - Пусть два механических исполнителя стукнутся кулаками. А потом вы — по-настоящему.
    x: 4
    y: 10
    icon: create:deployer
    shape: heart
    optional: true
    deps: [anvil_plough]
    tasks:
      - {type: advancement, advancement: create:fist_bump}
    rewards:
      - {type: xp, xp: 150}
      - {type: item, item: farmersdelight:cake_slice, count: 6}
