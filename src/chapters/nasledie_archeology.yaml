# Акт II. Археология: полевая работа Холма, окаменелости, музей и руины с тайниками.
chapter:
  filename: nasledie_archeology
  id: CF8AC0B0D69E3A34
  group: act2
  title: Археология — по следам Холма
  icon: minecraft:brush
  order_index: 4
  default_hide_dependency_lines: false
  default_quest_shape: circle
  progression_mode: flexible

links:
  - {quest: nasledie_chronicle/camp, x: -3, y: 0, shape: star, size: 1.4}

quests:
  # ── Полевая работа ──
  - key: brush
    id: D224CC946496E3DE
    title: Кисть вместо кирки
    description:
      - Холм говорил, что кирка уничтожает историю, а кисть её открывает. Сделайте железную кисть и расчистите ею что-нибудь.
    x: 0
    y: 0
    icon: betterarcheology:iron_brush
    size: 1.4
    deps: [nasledie_chronicle/camp]
    tasks:
      - {id: 54DDF0BE9F60D7B6, type: advancement, advancement: nasledie:alpha34/actions/54ddf0be9f60d7b6, title: Поработать железной кистью}
    rewards:
      - {type: xp, xp: 100}
      - {type: item, item: minecraft:brush}

  - key: sherd
    title: Крупицы истории
    description:
      - В подозрительном песке и гравии прячутся черепки старых ваз. Расчистите такой блок и достаньте черепок.
    x: 3
    y: 0
    icon: minecraft:archer_pottery_sherd
    deps: [brush]
    tasks:
      - {type: advancement, advancement: minecraft:adventure/salvage_sherd}
    rewards:
      - {type: xp, xp: 120}
      - {type: item, item: minecraft:experience_bottle, count: 6}

  - key: decorated_pot
    title: Ваза из черепков
    description:
      - Соберите вазу только из найденных черепков. Четыре рисунка с четырёх раскопов — уже маленькая выставка.
    x: 6
    y: 0
    icon: minecraft:decorated_pot
    optional: true
    deps: [sherd]
    tasks:
      - {type: advancement, advancement: minecraft:adventure/craft_decorated_pot_using_only_sherds}
    rewards:
      - {type: xp, xp: 150}
      - {type: item, item: artifacts:lucky_scarf}

  - key: loot_vase
    title: Разбитая ваза
    description:
      - В руинах стоят древние вазы с подношениями. Разбейте одну и заберите, что внутри. Холм бы поморщился, но поблагодарил за находку.
    x: 9
    y: 0
    icon: betterarcheology:loot_vase
    optional: true
    deps: [decorated_pot]
    tasks:
      - {type: advancement, advancement: betterarcheology:loot_vase_broken}
    rewards:
      - {type: xp, xp: 120}
      - {type: item, item: minecraft:gold_ingot, count: 6}

  # ── Окаменелости ──
  - key: fossil
    id: A39CCB33A472D0AD
    title: Первая часть древнего существа
    description:
      - В земле с окаменелостями попадаются кости давно вымерших животных. Найдите первую — голову или тело.
    x: 3
    y: -3
    icon: betterarcheology:villager_fossil_head
    deps: [brush]
    tasks:
      - {id: 4A2E602529B5A8EC, type: advancement, advancement: betterarcheology:fossil_found}
    rewards:
      - {id: 5D5E2FA366760A7E, type: xp, xp: 150}
      - {type: item, item: betterarcheology:fossiliferous_dirt, count: 2}

  - key: archeology_table
    id: C4248A7F0011AAF7
    title: Стол археолога
    description:
      - На столе археолога находки разбирают и изучают. Поставьте его — здесь будут рождаться артефакты.
    x: 6
    y: -3
    icon: betterarcheology:archeology_table
    deps: [fossil]
    tasks:
      - {type: advancement, advancement: nasledie:setup/archeology/archeology_table, title: Поставить стол археолога}
    rewards:
      - {type: xp, xp: 150}
      - {type: item, item: minecraft:diamond, count: 2}

  - key: shards
    id: 2BA185CBF139E3AF
    title: Осколок с неизвестной историей
    description:
      - Иногда кисть открывает не кость, а осколок чего-то сделанного руками. Найдите осколок артефакта.
    x: 9
    y: -3
    icon: betterarcheology:artifact_shards
    deps: [archeology_table]
    tasks:
      - {type: advancement, advancement: betterarcheology:artifact_shards}
    rewards:
      - {type: xp, xp: 150}
      - {type: item, item: minecraft:experience_bottle, count: 8}

  - key: unidentified
    id: 01C584DB0BC6D1D4
    title: Артефакт ждёт исследователя
    description:
      - Соберите из осколков неопознанный артефакт. Что он умеет, узнаете у стола — Холм провёл бы над ним всю ночь.
    x: 12
    y: -3
    icon: betterarcheology:unidentified_artifact
    shape: star
    deps: [shards]
    tasks:
      - {type: advancement, advancement: betterarcheology:unidentified_artifact}
    rewards:
      - {type: xp, xp: 250}
      - {type: item, item: betterarcheology:soul_totem}

  - key: diamond_brush
    id: 08AC8A56B7F8989F
    title: Более прочный инструмент
    description:
      - Железная кисть быстро тупится. Алмазная работает быстрее и реже ломает находки.
    x: 9
    y: -5.5
    icon: betterarcheology:diamond_brush
    optional: true
    deps: [archeology_table]
    tasks:
      - {type: advancement, advancement: nasledie:alpha34/actions/74fe1d1f8af47a14, title: Поработать алмазной кистью}
    rewards:
      - {type: xp, xp: 200}
      - {type: item, item: betterarcheology:bomb, count: 3}

  - key: all_fossils
    id: F4DBD3E2D7478445
    title: Четырнадцать фрагментов прошлого
    description:
      - Соберите головы и тела всех семи окаменелостей — от курицы до стража. Это работа на много вылазок, но и коллекция будет единственной
        в своём роде.
    x: 15
    y: -3
    icon: betterarcheology:guardian_fossil_head
    shape: star
    size: 1.4
    optional: true
    deps: [unidentified]
    tasks:
      - {id: 99D79EE77BC0C7C0, type: advancement, advancement: betterarcheology:all_fossils_found}
    rewards:
      - {type: xp, xp: 800}
      - {type: item, item: betterarcheology:radiance_totem}
      - {type: item, item: betterarcheology:growth_totem}

  # ── Музей ──
  - key: exhibit_chicken
    id: D97CBEDC468A5108
    title: Первый экспонат
    description:
      - Соберите из найденных частей и поставьте окаменелость курицы. Музей начинается с первой находки на постаменте, а не с сундука костей.
    x: 3
    y: 3
    icon: betterarcheology:chicken_fossil
    deps: [brush]
    tasks:
      - {type: advancement, advancement: nasledie:alpha34/actions/4f9e8a7b479c731c, title: Поставить окаменелость курицы}
    rewards:
      - {type: xp, xp: 150}
      - {type: item, item: minecraft:lantern, count: 4}

  - key: exhibit_creeper
    id: FCDA95A50F3EBC9F
    title: Доисторический крипер
    description:
      - Окаменелый крипер выглядит так же недружелюбно, как живой. Поставьте его рядом с первым экспонатом.
    x: 6
    y: 3
    icon: betterarcheology:creeper_fossil
    optional: true
    deps: [exhibit_chicken]
    tasks:
      - {type: advancement, advancement: nasledie:alpha34/actions/fbcd803abb48c000, title: Поставить окаменелость крипера}
    rewards:
      - {type: xp, xp: 150}
      - {type: item, item: betterarcheology:vase_creeper}

  - key: exhibit_guardian
    id: 72A2A054CFCAC69D
    title: Жизнь древних вод
    description:
      - Кости стража находят у воды и под водой. Поставьте его скелет — экспозиция о древнем море готова.
    x: 9
    y: 3
    icon: betterarcheology:guardian_fossil
    optional: true
    deps: [exhibit_creeper]
    tasks:
      - {type: advancement, advancement: nasledie:alpha34/actions/955b5cc01aede53d, title: Поставить окаменелость стража}
    rewards:
      - {type: xp, xp: 150}
      - {type: item, item: minecraft:prismarine_crystals, count: 12}

  - key: exhibit_wolf
    id: 9F662B92CD52ECF4
    title: След древнего хищника
    description:
      - Окаменелый волк — гордость любой коллекции. Поставьте его в центре зала.
    x: 12
    y: 3
    icon: betterarcheology:wolf_fossil
    optional: true
    deps: [exhibit_guardian]
    tasks:
      - {type: advancement, advancement: nasledie:alpha34/actions/609e3ad404ef3d43, title: Поставить окаменелость волка}
    rewards:
      - {type: xp, xp: 150}
      - {type: item, item: minecraft:bone_block, count: 8}

  - key: museum
    id: 8F6CAF327167B0A5
    title: Открыть двери музея
    description:
      - Обставьте зал — кафедра для истории раскопок, резная полка для записей экспедиции, ваза и свет. Пусть у находок будет дом.
    x: 15
    y: 3
    icon: minecraft:chiseled_bookshelf
    shape: star
    size: 1.4
    optional: true
    deps: [exhibit_wolf]
    tasks:
      - {id: 30E6662CF6244C50, type: advancement, advancement: nasledie:alpha41_qa2/museum/1_lectern, title: Кафедра}
      - {id: D625969196DCC507, type: advancement, advancement: nasledie:alpha41_qa2/museum/2_chiseled_bookshelf, title: Резная книжная полка}
      - {id: 326C70EB8D4659DA, type: advancement, advancement: nasledie:alpha41_qa2/museum/3_decorated_pot, title: Украшенная ваза}
      - {id: AC78608977F9C6B6, type: advancement, advancement: nasledie:alpha41_qa2/museum/4_lantern, title: Фонарь}
    rewards:
      - {type: xp, xp: 700}
      - {type: item, item: betterarcheology:torrent_totem}
      - {type: item, item: minecraft:experience_bottle, count: 24}

  # ── Руины и их тайники ──
  - key: buried_ruins
    id: FBF1AAEFC633EC9F
    title: Руины под песком
    description:
      - Пустыня прячет засыпанные дома. Найдите руины и откройте их сундук — песок сохранил его лучше, чем стены.
    x: 0
    y: 6
    icon: minecraft:suspicious_sand
    shape: scroll
    deps: [brush]
    tasks:
      - {type: criteria, title: Открыть сундук засыпанных руин, loot: betterarcheology:archeology/chest_buried_ruins_sand}
    rewards:
      - {type: xp, xp: 250}
      - {type: item, item: minecraft:golden_apple, count: 2}

  - key: tumulus
    id: 718927C2E9263AAC
    title: Курган на зелёном холме
    description:
      - Под травянистым холмом похоронен вождь. Вскройте курган и найдите его сундук.
    x: 3
    y: 6
    icon: minecraft:grass_block
    shape: scroll
    optional: true
    deps: [buried_ruins]
    tasks:
      - {type: criteria, title: Открыть сундук кургана, loot: betterarcheology:archeology/chest_tumulus}
    rewards:
      - {type: xp, xp: 250}
      - {type: item, item: better_weaponry:golden_claymore}

  - key: catacombs
    id: A387D38D6E080261
    title: Катакомбы забытых жителей
    description:
      - Под землёй тянутся коридоры с нишами для мёртвых. В катакомбах есть сундуки — и есть те, кто их сторожит.
    x: 6
    y: 6
    icon: minecraft:skeleton_skull
    shape: shield
    optional: true
    deps: [tumulus]
    tasks:
      - type: criteria
        title: Открыть сундук катакомб
        any_of:
          - {loot: betterarcheology:archeology/chest_catacombs_combat}
          - {loot: betterarcheology:archeology/chest_catacombs_generic}
          - {loot: betterarcheology:archeology/chest_catacombs_golden}
          - {loot: betterarcheology:archeology/chest_catacombs_library}
          - {loot: betterarcheology:archeology/chest_catacombs_potion}
    rewards:
      - {type: xp, xp: 300}
      - {type: item, item: artifacts:crystal_heart}

  - key: mesa_ruins
    id: 938F14F75C60045E
    title: Руины красной земли
    description:
      - На красных песках стоят остатки древних стен. Найдите их тайник.
    x: 9
    y: 6
    icon: minecraft:red_sand
    shape: scroll
    optional: true
    deps: [catacombs]
    tasks:
      - {type: criteria, title: Открыть сундук руин красной земли, loot: betterarcheology:archeology/chest_mesa_ruins}
    rewards:
      - {type: xp, xp: 250}
      - {type: item, item: minecraft:diamond, count: 3}

  - key: light_temple
    id: 19745F0470E73C17
    title: Зал древних светильников
    description:
      - Храм, где свет горел без огня. Его сокровищницу охраняют разбойники — видимо, они тоже что-то ищут.
    x: 0
    y: 9
    icon: minecraft:glowstone
    shape: shield
    optional: true
    deps: [buried_ruins]
    tasks:
      - {type: criteria, title: Открыть сокровищницу храма света, loot: betterarcheology:archeology/chest_light_temple_treasure}
    rewards:
      - {type: xp, xp: 300}
      - {type: item, item: artifacts:night_vision_goggles}

  - key: jungle_temple
    id: 316AFB9A561BE01E
    title: Храм под джунглями
    description:
      - Под корнями джунглей скрыт храм с ловушками. Пройдите его до сокровищницы.
    x: 3
    y: 9
    icon: minecraft:mossy_cobblestone
    shape: shield
    optional: true
    deps: [light_temple]
    tasks:
      - {type: criteria, title: Открыть сокровищницу храма джунглей, loot: betterarcheology:archeology/chest_jungle_temple_treasure}
    rewards:
      - {type: xp, xp: 300}
      - {type: item, item: minecraft:golden_apple, count: 3}

  - key: underwater
    id: 88352D47820D40B4
    title: Последний зал — под водой
    description:
      - Часть древних построек ушла под воду. Найдите затопленные руины и откройте их сундук, не утонув по дороге.
    x: 6
    y: 9
    icon: minecraft:prismarine_bricks
    shape: star
    optional: true
    deps: [jungle_temple]
    tasks:
      - {type: criteria, title: Открыть сундук затопленных руин, loot: betterarcheology:archeology/chest_underwater}
    rewards:
      - {type: xp, xp: 350}
      - {type: item, item: artifacts:aqua_dashers}

  - key: stonehenge
    id: C71D778A13B77EBF
    title: Каменный круг
    description:
      - Огромные камни, поставленные в круг. Зачем — не знал даже Холм. Найдите круг и постойте в центре на закате.
    x: 9
    y: 9
    icon: minecraft:stone
    shape: scroll
    optional: true
    deps: [underwater]
    tasks:
      - {type: structure, structure: betterarcheology:stonehenge_grassy}
    rewards:
      - {type: xp, xp: 230}
      - {type: item, item: minecraft:emerald, count: 16}

  - key: villager_grave
    id: D69937827610767B
    title: Забытая могила жителя
    description:
      - Одинокая могила на пустыре. Чья она — неизвестно. Найдите её; иногда под надгробием есть что-то кроме костей.
    x: -3
    y: 3
    icon: minecraft:cobblestone_wall
    shape: scroll
    optional: true
    deps: [brush]
    tasks:
      - {type: structure, structure: betterarcheology:villager_grave}
    rewards:
      - {type: xp, xp: 150}
      - {type: item, item: betterarcheology:vase_green}
