# Акт I. Дом: кухня, огород, тепло и запасы. Глава без сюжетных обязательств.
chapter:
  filename: nasledie_life
  id: 5C7EC49FBED1A9C6
  group: act1
  title: Дом, к которому возвращаются
  icon: farmersdelight:cooking_pot
  order_index: 1
  default_hide_dependency_lines: true
  default_quest_shape: step
  progression_mode: flexible

quests:
  - key: bed
    title: Ночлег
    description:
      - Экспедиция начинается не с карты, а с места, куда хочется вернуться. Поставьте кровать и переночуйте — так мир запомнит, где ваш дом.
    x: 0
    y: 0
    icon: minecraft:red_bed
    shape: home
    size: 1.4
    tasks:
      - {type: advancement, advancement: minecraft:adventure/sleep_in_bed}
    rewards:
      - {type: xp, xp: 40}
      - {type: item, item: minecraft:lantern, count: 4}

  # ── Кухня ──
  - key: knife
    id: 4322668146484A1C
    title: Нож повара
    description:
      - Даже дальняя вылазка начинается с хорошего ужина. Сделайте кухонный нож — кремнёвого вполне хватит. Им режут продукты на доске и
        срезают солому с травы.
    x: 3
    y: 0
    icon: farmersdelight:flint_knife
    deps: [bed]
    tasks:
      - {id: 477EAE38055AFECF, type: advancement, advancement: farmersdelight:main/craft_knife}
    rewards:
      - {id: 5C2CEFB27380022A, type: xp, xp: 40}
      - {type: item, item: farmersdelight:cutting_board}

  - key: cutting_board
    id: 464A27B6AA037B37
    title: Разделочная доска
    description:
      - Положите продукт на доску и разделайте его ножом. Из одного куска мяса выходит несколько порций, из капусты — листья для голубцов.
    x: 5.5
    y: 0
    icon: farmersdelight:cutting_board
    deps: [knife]
    tasks:
      - {type: advancement, advancement: farmersdelight:main/use_cutting_board}
    rewards:
      - {type: xp, xp: 50}
      - {type: item, item: minecraft:iron_ingot, count: 4}

  - key: cooking_pot
    id: 70BD314183AC1CDE
    title: Котёл на кухне
    description:
      - Кухонный котёл варит супы и рагу, которые сытнее любого жаркого. Поставьте его над огнём или жаровней и попробуйте первый рецепт.
    x: 8
    y: 0
    icon: farmersdelight:cooking_pot
    deps: [cutting_board]
    tasks:
      - {type: advancement, advancement: farmersdelight:main/place_cooking_pot}
    rewards:
      - {type: xp, xp: 60}
      - {type: item, item: farmersdelight:skillet}

  - key: nourishing
    id: 4E740C0034B4382F
    title: Сытный обед
    description:
      - Блюда из котла дают «Сытость» — голод надолго перестаёт мешать работе. Перед дальней дорогой это важнее лишнего стака хлеба.
    x: 10.5
    y: 0
    icon: farmersdelight:beef_stew
    deps: [cooking_pot]
    tasks:
      - {type: advancement, advancement: farmersdelight:main/eat_nourishing_food}
    rewards:
      - {type: xp, xp: 70}
      - {type: item, item: farmersdelight:apple_cider, count: 2}

  - key: feast
    id: 52659216F4F03E2C
    title: Максим, ужин готов!
    description:
      - Некоторые блюда подают целиком на стол — режьте и угощайте друг друга. Приготовьте праздничное блюдо и поставьте его, пока Юра
        не съел всё прямо из котла.
    x: 13
    y: 0
    icon: farmersdelight:roast_chicken_block
    shape: milestone
    optional: true
    deps: [nourishing]
    tasks:
      - {type: advancement, advancement: farmersdelight:main/place_feast}
    rewards:
      - {type: xp, xp: 140}
      - {type: item, item: farmersdelight:cabbage_rolls, count: 6}

  - key: master_chef
    title: Шеф-повар нового мира
    description:
      - Попробуйте все блюда, какие умеет ваша кухня. Это долгая цель на много вечеров — зато в награду рюкзак научится сам кормить вас в пути.
    x: 15.5
    y: 0
    icon: farmersdelight:honey_glazed_ham_block
    shape: milestone
    size: 1.4
    optional: true
    deps: [feast]
    tasks:
      - {type: advancement, advancement: farmersdelight:main/master_chef}
    rewards:
      - {type: xp, xp: 600}
      - {type: item, item: sophisticatedbackpacks:advanced_feeding_upgrade}

  # ── Огород ──
  - key: wild_seeds
    id: 42E5495CA00F5CC6
    title: Семена другого мира
    description:
      - В дикой природе растут капуста, томаты, лук и рис. Принесите домой хотя бы одну новую культуру — с неё начнётся огород, который прокормит
        вас между вылазками.
    x: 3
    y: -3
    icon: farmersdelight:cabbage_seeds
    deps: [bed]
    tasks:
      - {id: 5A407032247C7A03, type: advancement, advancement: farmersdelight:main/get_fd_seed}
    rewards:
      - {id: 266E0006AE14F939, type: xp, xp: 40}
      - {type: item, item: farmersdelight:rope, count: 8}

  - key: rice
    id: 5B2F6F1B27706E1D
    title: Рисовые поля
    description:
      - Рис сажают в неглубокую воду. Пока он растёт, рядом можно устроить пруд или ферму — место у воды всегда пригодится.
    x: 5.5
    y: -3
    icon: farmersdelight:rice_panicle
    deps: [wild_seeds]
    tasks:
      - {type: advancement, advancement: farmersdelight:main/plant_rice}
    rewards:
      - {type: xp, xp: 50}
      - {type: item, item: minecraft:bone_meal, count: 16}

  - key: tomato
    id: 1E550CA158EE0E76
    title: Томаты на верёвке
    description:
      - Томатная лоза ползёт вверх по верёвке над грядкой. Подвяжите её и соберите урожай с высокого куста.
    x: 8
    y: -3
    icon: farmersdelight:tomato
    deps: [rice]
    tasks:
      - {type: advancement, advancement: farmersdelight:main/harvest_ropelogged_tomato}
    rewards:
      - {type: xp, xp: 55}
      - {type: item, item: farmersdelight:pasta_with_meatballs, count: 3}

  - key: rich_soil
    id: 0F10C8510B15A8C2
    title: Плодородная почва
    description:
      - Органический компост медленно превращается в плодородную почву — быстрее на солнце, у воды и рядом с грибами. На ней урожай растёт
        бодрее, а грибы дают колонии.
    x: 10.5
    y: -3
    icon: farmersdelight:rich_soil
    deps: [tomato]
    tasks:
      - {type: advancement, advancement: farmersdelight:main/get_rich_soil}
    rewards:
      - {type: xp, xp: 70}
      - {type: item, item: minecraft:brown_mushroom, count: 4}
      - {type: item, item: minecraft:red_mushroom, count: 4}

  - key: mushroom_colony
    id: 6D582231374D6FBB
    title: Грибная ферма
    description:
      - Посадите гриб на плодородную почву в тени и дождитесь колонии. Срежьте её ножом — так грибы можно разводить без поисков по пещерам.
    x: 13
    y: -3
    icon: farmersdelight:brown_mushroom_colony
    optional: true
    deps: [rich_soil]
    tasks:
      - {type: advancement, advancement: farmersdelight:main/get_mushroom_colony}
    rewards:
      - {type: xp, xp: 80}
      - {type: item, item: farmersdelight:mushroom_rice, count: 2}

  - key: all_crops
    id: 63867CE6EB276D6B
    title: Огород со всего света
    description:
      - Вырастите все культуры, какие найдёте в этом мире. Для этого придётся заглянуть в разные климаты — повод для пары неторопливых путешествий.
    x: 15.5
    y: -3
    icon: farmersdelight:fruit_salad
    shape: milestone
    size: 1.4
    optional: true
    deps: [mushroom_colony]
    tasks:
      - {type: advancement, advancement: farmersdelight:main/plant_all_crops}
    rewards:
      - {type: xp, xp: 300}
      - {type: item, item: minecraft:golden_carrot, count: 16}
      - {type: item, item: farmersdelight:fruit_salad, count: 4}

  - key: breed
    id: 470CCDD13E8599DD
    title: Своё стадо
    description:
      - Приведите домой пару животных и вырастите потомство. Своя ферма — это мясо, шерсть и кожа без охоты по окрестностям.
    x: 0
    y: -3
    icon: minecraft:wheat
    optional: true
    deps: [bed]
    tasks:
      - {type: advancement, advancement: minecraft:husbandry/breed_an_animal}
    rewards:
      - {type: xp, xp: 60}
      - {type: item, item: minecraft:lead, count: 2}
      - {type: item, item: minecraft:name_tag}

  # ── Тепло ──
  - key: insulate
    id: 42A7FBADC6571244
    title: Одежда по погоде
    description:
      - В этом мире холод и жара опасны всерьёз. На швейном столе к броне пришивают утеплитель — козий мех от холода, хоглинью шкуру от жары.
    x: 3
    y: 3
    icon: cold_sweat:goat_fur_chestplate
    deps: [bed]
    tasks:
      - {type: advancement, advancement: cold_sweat:insulate_armor}
    rewards:
      - {type: xp, xp: 80}
      - {type: item, item: cold_sweat:thermometer}

  - key: hearth
    id: 119A349F7B3DEF2E
    title: Тепло родного очага
    description:
      - Очаг держит в доме ровную температуру, если подать ему топливо. Зимой это разница между уютом и инеем на ресницах.
    x: 5.5
    y: 3
    icon: cold_sweat:hearth
    shape: home
    deps: [insulate]
    tasks:
      - {type: advancement, advancement: cold_sweat:use_hearth}
    rewards:
      - {type: xp, xp: 100}
      - {type: item, item: cold_sweat:waterskin}

  - key: smokestack
    id: 05F72175E8F3882D
    title: Дымоход
    description:
      - Поставьте дымоход на бойлер или холодильник — устройство начнёт прогревать или охлаждать не только себя, но и всю комнату.
    x: 8
    y: 3
    icon: cold_sweat:smokestack
    optional: true
    deps: [hearth]
    tasks:
      - {type: advancement, advancement: cold_sweat:use_smokestack}
    rewards:
      - {type: xp, xp: 100}
      - {type: item, item: cold_sweat:goat_fur, count: 4}

  - key: full_insulation
    title: Одет по сезону
    description:
      - Утеплите полный комплект брони. В горах и пустынях, куда уходила экспедиция, без этого долго не продержаться.
    x: 8
    y: 4.5
    icon: cold_sweat:goat_fur_helmet
    deps: [hearth]
    tasks:
      - {type: advancement, advancement: cold_sweat:full_insulation}
    rewards:
      - {type: xp, xp: 150}
      - {type: item, item: cold_sweat:hoglin_hide, count: 4}

  - key: first_grave
    title: Юра, где твои вещи?
    description:
      - Рано или поздно кто-то из вас упадёт в лаву или встретит крипера. Вещи не пропадут — на месте гибели появится могила. Найдите её и
        заберите своё.
    x: 0
    y: 3
    icon: minecraft:skeleton_skull
    optional: true
    deps: [bed]
    tasks:
      - {type: advancement, advancement: tombstone:adventure/first_grave}
    rewards:
      - {type: xp, xp: 30}
      - {type: item, item: minecraft:golden_carrot, count: 4}

  # ── Запасы ──
  - key: backpack
    id: 69525CBD49DF5FDB
    title: Рюкзак за плечами
    description:
      - Сшейте рюкзак и наденьте его. В нём помещается больше, чем в карманах, а улучшения научат его подбирать, сортировать и даже кормить.
    x: 3
    y: 7
    icon: sophisticatedbackpacks:backpack
    deps: [bed]
    tasks:
      - {id: 6EB6532083976608, type: advancement, advancement: nasledie:alpha35/engineering/69525cbd49df5fdb}
    rewards:
      - {id: 5B478A995FFA5042, type: xp, xp: 60}
      - {id: 5171D320535CAC28, type: item, item: sophisticatedbackpacks:upgrade_base}

  - key: pickup
    id: 6BF257BC86E5F51D
    title: Рюкзак подбирает находки
    description:
      - Улучшение «Подбор» складывает добычу прямо в рюкзак. Удобно, когда в шахте разбегаются руды и кости скелетов.
    x: 5.5
    y: 7
    icon: sophisticatedbackpacks:pickup_upgrade
    deps: [backpack]
    tasks:
      - {type: advancement, advancement: nasledie:alpha35/engineering/6bf257bc86e5f51d}
    rewards:
      - {type: xp, xp: 90}
      - {type: item, item: sophisticatedbackpacks:magnet_upgrade}

  - key: iron_chest
    id: 3CC7916DB9793560
    title: Место для запасов
    description:
      - Обычных сундуков скоро станет мало. Поставьте железный сундук — его можно улучшать дальше, а в кладовой появится порядок.
    x: 8
    y: 7
    icon: sophisticatedstorage:iron_chest
    optional: true
    deps: [pickup]
    tasks:
      - {type: advancement, advancement: nasledie:alpha34/actions/bdc7f410e273570a}
    rewards:
      - {type: xp, xp: 80}
      - {type: item, item: sophisticatedstorage:pickup_upgrade}
