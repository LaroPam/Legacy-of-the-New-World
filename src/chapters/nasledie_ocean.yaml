    type: item
    item: alexscaves:diving_chestplate
- id: 7561C2A49CE25872
  title: Победить старшего стража
  x: 17.5
  y: 0.0
  icon: minecraft:sponge
  shape: shield
  size: 1.2
  description:
  - Убейте старшего стража в монументе. Заранее оставьте проход для отхода и запас воздуха; молоко снимет утомление,
    но одновременно уберёт и полезные эффекты.
  - Заключительное испытание потребует обеих побед под морской силой. Проверьте эффект перед последним ударом, если
    хотите выполнить его в этом же походе.
  deps:
