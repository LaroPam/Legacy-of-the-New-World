    type: item
    item: sophisticatedbackpacks:pump_upgrade
- id: 76F24423146B2BF8
  title: Найти монумент для плацдарма
  x: 10.0
  y: 0.0
  icon: minecraft:prismarine_bricks
  shape: scroll
  size: 1.2
  description:
  - Найдите океанский монумент YUNG и выберите место для проводника снаружи. Ищите Ocean Monument в списке компаса,
    если прямой поиск в море затянулся.
  - 'Для рамки пригодятся призмарин, призмариновые кирпичи, тёмный призмарин или морские фонари. Их можно собрать
    и в руинах проводника из боковой ветки. Не рассчитывайте легко добывать блоки рядом со старшими стражами: они
    накладывают утомление.'
  deps:
  - F70436662909AF80
  tasks:
  - id: 7FAE7D04F05EBF32
    type: structure
    structure: betteroceanmonuments:ocean_monument
  rewards:
