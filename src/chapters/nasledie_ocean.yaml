quests:
- id: A68C40E37C45E3BF
  title: Выйти в глубокий океан
  x: 0.0
  y: 0.0
  icon: minecraft:water_bucket
  shape: scroll
  size: 1.5
  description:
  - 'Доберитесь до глубокого океана. Главный проект этой главы — подводный плацдарм: найдите сердце моря, включите
    проводник возле монумента и победите обоих стражей под его защитой.'
  - Начните с затонувшего корабля. Его карта клада поможет искать сердце моря; раковины понадобятся для проводника.
    Боковая ветка кораблей тоже награждает раковинами.
  - Руины двух морей и поход к галере — отдельные экспедиции. Водолазный комплект Create удобен для работы под водой,
    но не обязателен для основного маршрута.
  tasks:
  - id: 2FEBEB75DA38988A
    type: biome
    biome: minecraft:deep_ocean
  rewards:
  - id: 2628A3EB0042C12E
    type: xp
    xp: 100
  - id: 62AF445078F2DCE7
    type: item
    item: create:copper_diving_helmet
- id: D5B701274F41916E
  title: Найти затонувший корабль
  x: 2.5
  y: 0.0
  icon: minecraft:oak_boat
  shape: scroll
  size: 1.2
  description:
  - 'Найдите кораблекрушение. Ищите сундук с картой клада: она укажет место поиска сердца моря. Сундук и нужная
    карта есть не в каждом обломке.'
  - Возьмите лодку и еду, осматривайте отсеки короткими погружениями. После разведки переходите к добыче сердца
    моря.
  deps:
  - A68C40E37C45E3BF
  tasks:
  - id: 96FFB4E0BF7E16C8
    type: structure
    structure: minecraft:shipwreck
  rewards:
