    type: xp
    xp: 100
  - id: 200C736EA942D80A
    type: item
    item: alexscaves:lanternfish_bucket
- id: A6C3DFEC8B6B5AA3
  title: Запустить проводник у монумента
  x: 12.5
  y: 0.0
  icon: minecraft:conduit
  shape: gear
  size: 1.2
  description:
  - Активируйте проводник и получите эффект морской силы. Сердце моря и восемь раковин дают сам блок, но для работы
    нужны вода и рамка.
  - 'Окружите проводник водой в области три на три на три. На расстоянии двух блоков от него соберите квадратную
    рамку пять на пять из 16 призмариновых блоков: это минимальный рабочий контур. Сам проводник находится в центре
    рамки.'
  - Под водой рядом должен появиться эффект. Он даёт дыхание и помогает работать в глубине; после запуска переходите
    к боям со стражами. Место у монумента — полезный выбор для проекта, а зачёт даёт сам эффект.
  deps:
  - 76F24423146B2BF8
  tasks:
