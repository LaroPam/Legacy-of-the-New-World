    type: xp
    xp: 100
  - id: 31FD27AACB5A8B9F
    type: item
    item: create:copper_diving_boots
- id: F805A24AC6136435
  title: Победить утопленника
  x: 5.0
  y: 0.0
  icon: minecraft:rotten_flesh
  shape: shield
  size: 1.2
  description:
  - 'Победите одного утопленника. Для проводника нужны раковины наутилуса: присматривайтесь к тем, кто держит раковину
    в руке.'
  - Зачтётся любой утопленник; раковина не гарантирована каждому противнику. Ещё её можно получить рыбалкой или
    за морские экспедиции этой главы.
  deps:
