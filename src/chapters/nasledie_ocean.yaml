    item: minecraft:prismarine_crystals
    count: 24
- id: F70436662909AF80
  title: Добыть сердце моря
  x: 7.5
  y: 0.0
  icon: minecraft:heart_of_the_sea
  shape: scroll
  size: 1.2
  description:
  - Получите одно сердце моря. Самый понятный путь — карта клада из затонувшего корабля и поиски сундука на отмеченном
    берегу.
  - 'Сохраните сердце: вместе с восемью раковинами наутилуса оно превращается в проводник. Следующая цель — выбрать
    место у монумента и запустить подводное убежище.'
  deps:
  - F805A24AC6136435
  tasks:
