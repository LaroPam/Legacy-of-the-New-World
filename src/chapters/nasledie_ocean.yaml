    type: xp
    xp: 100
  - id: 0DD8A2610AA1FBE3
    type: item
    item: alexscaves:diving_helmet
- id: D8C373CD97382003
  title: Победить обычного стража
  x: 15.0
  y: 0.0
  icon: minecraft:prismarine_shard
  shape: shield
  size: 1.2
  description:
  - Убейте обычного стража. Теперь испытайте выбранное укрытие и расстояние, на котором луч перестаёт вас доставать.
  - Если проводник уже работает, держите бой внутри его действия. Эта же подготовка понадобится против старшего
    стража.
  deps:
