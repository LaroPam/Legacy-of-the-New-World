# В каждом — вход, главная тайна, существо или страж. Бои со стражами — сюжетные квесты летописи («Глубины»).
# Раскладка — src/layouts/legends.yaml.
chapter:
  filename: nasledie_legends
  id: 2D3B7589DD553745
  group: act4
  title: Легенды глубин — шесть потерянных миров
  icon: alexscaves:cave_map
