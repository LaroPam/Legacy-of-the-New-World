    rewards:
      - {type: xp, xp: 150}
      - {type: item, item: minecraft:iron_ingot, count: 12}

  - key: neodymium
    id: 5EEE4A0183E3245F
    title: Две стороны неодима
    description:
      - Лазурный и алый неодим притягивают и отталкивают. Добудьте оба вида.
    x: 0.0
    y: -6.0
    icon: alexscaves:raw_azure_neodymium
    deps: [magnetic]
    tasks:
      - {type: advancement, advancement: alexscaves:alexscaves/neodymium}
    rewards:
