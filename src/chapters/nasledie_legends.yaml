      - {type: item, item: alexscaves:resistor_shield}

  - key: magnetron
    id: 054E760F5D9B1153
    title: Сердце магнитной бури
    description:
      - Магнетрон собирает себе тело из летающих блоков. Сразите его и заберите железное сердце.
    x: 0.0
    y: -8.5
    icon: alexscaves:ferrouslime_ball
    shape: shield
    deps: [neodymium]
    tasks:
      - {type: advancement, advancement: alexscaves:alexscaves/defeat_magnetron}
    rewards:
      - {type: xp, xp: 400}
      - {type: item, item: alexscaves:magnetic_levitation_rail, count: 16}

  - key: boundroid
    id: FCE22E10D39BCA44
    title: Страж на тяжёлой цепи
    description:
