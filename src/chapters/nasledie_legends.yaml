      - {type: item, item: alexscaves:seeking_arrow, count: 16}

  - key: quarry
    id: 6F2F3D36A0C60B9E
    title: Карьер до дна мира
    description:
      - Магнитный карьер копает сам. Пусть дойдёт до самого дна мира — путь к центру земли открыт.
    x: 0.0
    y: -13.5
    icon: alexscaves:quarry
    shape: star
    optional: true
    deps: [boundroid]
    tasks:
      - {type: advancement, advancement: alexscaves:alexscaves/finished_quarry}
    rewards:
      - {type: xp, xp: 450}
      - {type: item, item: minecraft:diamond, count: 6}

  - key: galena
    id: FD6B3DB0A377F701
    title: Магнитный удар издалека
    description:
      - Галенитовая перчатка бросает металл как снаряд. Сразите ею моба с двадцати блоков.
    x: 2.25
    y: -9.74
    icon: alexscaves:galena_gauntlet
    optional: true
    deps: [magnetron]
    tasks:
