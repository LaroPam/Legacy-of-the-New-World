    rewards:
      - {type: xp, xp: 380}
      - {type: item, item: alexscaves:scarlet_neodymium_ingot, count: 4}

  - key: notor
    id: 5DA969509DFEF44B
    title: Маячок больше не выдаст
    description:
      - Маленькие летающие маячки следят за пещерой и выдают вас. Собейте один.
    x: 1.69
    y: -7.31
    icon: minecraft:observer
    optional: true
    deps: [neodymium]
    tasks:
      - {type: advancement, advancement: alexscaves:alexscaves/defeat_notor}
    rewards:
      - {type: xp, xp: 250}
      - {type: item, item: alexscaves:azure_neodymium_ingot, count: 4}

  # ── Первобытные пещеры ──
  - key: primordial
    id: A682A9C8CBE99BB1
    title: Мир, забывший о времени
    description:
