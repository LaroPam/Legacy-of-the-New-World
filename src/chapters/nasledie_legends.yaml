quests:
  # ── Вход в глубины ──
  - key: cave_tablet
    id: E5CDBE2CB81CBFFC
    title: Табличка зовёт под землю
    description:
      - В подземных хижинах лежат пещерные таблички с рисунками далёких глубин. Найдите одну — с неё начинается путь вниз.
    x: -3.0
    y: -5.2
    icon: alexscaves:cave_tablet
    deps: [nasledie_chronicle/route]
    tasks:
      - {type: advancement, advancement: alexscaves:alexscaves/cave_tablet}
    rewards:
      - {type: xp, xp: 120}
      - {type: item, item: alexscaves:bioluminescent_torch, count: 16}

  - key: cave_codex
    id: 8B88E55204890F85
    title: Прочитать древнюю табличку
    description:
      - Переведите табличку на столе спелеолога. Письмена старше любой деревни — возможно, их писали Зодчие.
    x: -1.75
    y: -3.03
    icon: alexscaves:cave_codex
    deps: [cave_tablet]
    tasks:
      - {type: advancement, advancement: alexscaves:alexscaves/cave_codex}
    rewards:
      - {type: xp, xp: 150}
      - {type: item, item: alexscaves:amber, count: 4}

  - key: cave_map
    id: 1E0319E7396C1AF2
    title: Карта потерянной глубины
    description:
      - Пещерная карта ведёт к одному из шести затерянных миров. Выберите, куда спуститесь первыми.
    x: 0.0
    y: 0.0
    icon: alexscaves:cave_map
    shape: star
    size: 2
    deps: [cave_codex]
    tasks:
      - {type: advancement, advancement: alexscaves:alexscaves/cave_map}
    rewards:
      - {type: xp, xp: 200}
      - {type: item, item: alexscaves:floater, count: 2}

  - key: cave_book
    id: 3C74408B2EA9F8D7
    title: Книга шести экспедиций
    description:
      - Пещерный путеводитель записывает всё, что вы узнали о глубинах. Соберите его — пригодится и Максиму, и Юре.
    x: -4.25
    y: -7.36
    icon: alexscaves:cave_book
    optional: true
    deps: [cave_tablet]
    tasks:
      - {type: advancement, advancement: alexscaves:alexscaves/cave_book}
    rewards:
      - {type: xp, xp: 120}
      - {type: item, item: alexscaves:sack_of_sating}

  - key: atlas
    id: E9BA2C6E0A89756A
    title: Атлас шести глубин
    description:
      - Побывайте во всех шести затерянных мирах. Таких атласов не было даже у Линд.
    x: -3.0
    y: 5.2
    icon: minecraft:filled_map
    shape: star
    size: 1.6
    optional: true
    deps: [cave_map]
    tasks:
      - {type: advancement, advancement: alexscaves:alexscaves/discover_magnetic_caves, title: Магнитные пещеры}
      - {type: advancement, advancement: alexscaves:alexscaves/discover_primordial_caves, title: Первобытные пещеры}
      - {type: advancement, advancement: alexscaves:alexscaves/discover_toxic_caves, title: Токсичные пещеры}
      - {type: advancement, advancement: alexscaves:alexscaves/discover_abyssal_chasm, title: Бездонная расщелина}
      - {type: advancement, advancement: alexscaves:alexscaves/discover_forlorn_hollows, title: Заброшенные пустоты}
      - {type: advancement, advancement: alexscaves:alexscaves/discover_candy_cavity, title: Конфетный котлован}
    rewards:
      - {type: xp, xp: 1100}
      - {type: item, item: alexscaves:totem_of_possession}

  # ── Магнитные пещеры ──
  - key: magnetic
    id: 60D9315769C4E578
    title: Магнитные пещеры
    description:
      - Здесь металл парит в воздухе, а компас сходит с ума. Спуститесь в магнитные пещеры.
    x: 0.0
    y: -3.5
    icon: alexscaves:azure_magnet
    deps: [cave_map]
    tasks:
