- id: C1772DE6B882A602
  title: Материал большого путешествия
  x: 0.0
  y: 0.0
  icon: create:sturdy_sheet
  shape: gear
  size: 1.2
  description:
  - Получите прочный лист Create из переработанного обсидиана по рецепту. Он откроет железнодорожные компоненты.
  - Главная цель — собрать поезд и уйти на нём в дальнюю экспедицию. По дороге можно обустроить вокзал с табло,
    расширить состав или построить маршрут через портал. Авиация — самостоятельная альтернатива для разведки.
  tasks:
  - id: A9B7BEC16BC9B0C6
    type: advancement
    advancement: create:sturdy_sheet
  rewards:
  - id: D20E6830EACB6DEC
    type: xp
    xp: 75
  - id: BD21D32CFDC58823
    type: item
    item: railways:buffer
- id: 0BE47753BC6BEF28
  title: Компоненты будущего состава
  x: 5.0
  y: 0.0
  icon: create:railway_casing
  shape: gear
  size: 1.2
  description:
  - Примените прочные листы для создания железнодорожного корпуса. Подготовьте компоненты станции и поезда; состав
    собирается у станции, а не обычным размещением вагонетки.
  deps:
  - 168FB859D289DA38
  tasks:
