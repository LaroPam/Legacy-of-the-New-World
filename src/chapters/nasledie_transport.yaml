  icon: minecraft:minecart
  shape: gear
  size: 1.2
  optional: true
  description:
  - 'Соберите поезд как минимум из шести вагонов. Продумайте назначение состава: пассажирские места, экспедиционное
    имущество и место для будущих находок. Для зачёта важна длина собранного поезда.'
