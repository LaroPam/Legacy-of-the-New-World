    item: railways:benchcart
- id: 27A5DCA80F77C440
  title: Передать маршрут машинисту
  x: 7.5
  y: 2.5
  icon: create:schedule
  shape: gear
  size: 1.2
  description:
  - Назначьте машинисту расписание поезда. Укажите станции и условия отправления, чтобы состав мог выполнять поездки
    по вашему плану. Этот шаг подтверждает передачу расписания; завершение рейса проверьте сами.
  deps:
