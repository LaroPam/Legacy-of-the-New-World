  x: 7.5
  y: -2.5
  icon: create:steam_whistle
  shape: gear
  size: 1.2
  description:
  - Установите паровой свисток на поезд и подайте сигнал во время управления. Теперь состав можно услышать при отправлении;
    следующая экспедиция пересечёт границу измерений.
