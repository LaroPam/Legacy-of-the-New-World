  x: 10.0
  y: -2.5
  icon: minecraft:amethyst_block
  shape: star
  size: 1.4
  optional: true
  description:
  - 'Проедьте на поезде через портал. Подготовьте выход и продолжение пути по ту сторону заранее. Это законченный
    транспортный проект: ваши базы в разных измерениях получают железнодорожное сообщение.'
