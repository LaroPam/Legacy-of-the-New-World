    type: item
    item: railways:big_buffer
- id: D727915E29A5F477
  title: Поезд готов к отправлению
  x: 7.5
  y: 0.0
  icon: create:track_station
  shape: star
  size: 1.4
  description:
  - Соберите первый поезд Create у станции. Сперва сделайте короткий испытательный путь и небольшой состав с местом
    управления. Встроенная анимация станции покажет сборку.
  - 'После этого выбирайте: организовать регулярное движение и вокзал или строить протяжённую линию для большой
    экспедиции.'
  deps:
  - 0BE47753BC6BEF28
  tasks:
