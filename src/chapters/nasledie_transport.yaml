  title: Сигналы для общей линии
  x: 10.0
  y: 2.5
  icon: create:track_signal
  shape: gear
  size: 1.2
  description:
  - Установите железнодорожный сигнал. Он разделяет путь на участки и помогает организовать движение нескольких
    составов. Перед регулярными рейсами разберитесь, какой участок контролирует каждый сигнал.
  deps:
