  x: 12.5
  y: 2.5
  icon: create:display_board
  shape: star
  size: 1.4
  description:
  - 'Выведите прогноз прибытия поезда на табло с помощью передатчиков данных. Это финал проекта пассажирского вокзала:
    маршрут задан, участки обозначены, ожидаемый рейс виден вам обоим.'
