  x: 15.0
  y: 0.0
  icon: create:green_seat
  shape: star
  size: 1.4
  optional: true
  description:
  - 'Покиньте место управления поездом более чем в 5000 блоках от точки начала поездки. Круги возле базы не заменят
    дальность: нужна удалённая конечная точка.'
  - Это финал большого железнодорожного путешествия. Найдите место для новой станции, чтобы следующая экспедиция
    начиналась уже с освоенной линии.
