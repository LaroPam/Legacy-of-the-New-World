  title: Путь между вашими поселениями
  x: 2.5
  y: 0.0
  icon: create:track
  shape: gear
  size: 1.2
  description:
  - 'Получите железнодорожные пути Create. Наметьте две полезные точки: дом и добывающий участок, деревню или будущий
    порт. Железная дорога должна соединять места, куда вам действительно хочется ездить.'
