  x: 10.0
  y: 5.0
  icon: create:track_signal
  shape: gear
  size: 1.2
  optional: true
  description:
  - Проедьте на запрещающий красный сигнал. Это шуточное испытание Create, а не образец правильного движения. Выделите
    для опыта отдельный участок, чтобы не мешать рабочему расписанию.
