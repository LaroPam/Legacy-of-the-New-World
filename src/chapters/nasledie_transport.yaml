  x: 10.0
  y: 0.0
  icon: create:mechanical_press
  shape: gear
  size: 1.2
  optional: true
  description:
  - Изготовьте больше 1000 железнодорожных путей одним и тем же механическим прессом. Подготовьте постоянную подачу
    ингредиентов и сохраняйте выбранный пресс на месте.
  - Такой объём нужен для дальней дороги. После производства пути увеличим состав и отправимся за пределы обжитой
    территории.
