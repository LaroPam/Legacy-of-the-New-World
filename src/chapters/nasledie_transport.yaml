  icon: immersive_aircraft:biplane
  shape: gear
  size: 1.2
  optional: true
  description:
  - Сядьте в биплан. Самолёт — отдельное направление для поиска новых мест, пока железная дорога ещё не проложена.
  - Зачёт отмечает посадку на борт. Перед дальним полётом освойте управление, подготовьте необходимые припасы и
    выберите место возвращения.
