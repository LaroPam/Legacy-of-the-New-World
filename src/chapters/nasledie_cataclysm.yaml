quests:
  - key: eight_victories
    id: 5E6173A11D04779E
    title: Восемь побед Катаклизма
    description:
      - Победите всех восьмерых — огонь, бездну, бурю, проклятие, пустыню, машину, чудовище и пустоту. Мир, который держали сосуды, теперь
        держите вы. Победы считаются на команду — неважно, чей удар был последним.
    x: 13.44
    y: 13.44
    icon: cataclysm:bulwark_of_the_flame
    shape: boss
    size: 2
    hide_dependency_lines: true
    deps: [nasledie_chronicle/ignis, nasledie_chronicle/leviathan, nasledie_chronicle/harbinger, nasledie_chronicle/ender_guardian,
           nasledie_chronicle/maledictus, nasledie_chronicle/remnant, nasledie_chronicle/monstrosity, nasledie_chronicle/scylla]
    tasks:
      - {type: kill, entity: cataclysm:ignis, value: 1}
      - {type: kill, entity: cataclysm:the_leviathan, value: 1}
      - {type: kill, entity: cataclysm:the_harbinger, value: 1}
      - {type: kill, entity: cataclysm:ender_guardian, value: 1}
      - {type: kill, entity: cataclysm:maledictus, value: 1}
      - {type: kill, entity: cataclysm:ancient_remnant, value: 1}
      - {type: kill, entity: cataclysm:netherite_monstrosity, value: 1}
      - {type: kill, entity: cataclysm:scylla, value: 1}
    rewards:
      - {type: xp, xp: 3000}
      - {type: item, item: cataclysm:bulwark_of_the_flame}
      - {type: item, item: minecraft:enchanted_golden_apple, count: 2}

