    title: Око пустоты
    description:
      - Око пустоты собирают из пурпура и панцирей шалкеров — значит, путь к нему лежит через города Края. Оно смотрит на последний доспех.
    x: 0.0
    y: -3.5
    icon: cataclysm:void_eye
    deps: [nasledie_chronicle/nether_eye]
    tasks:
      - {type: item, item: cataclysm:void_eye}
    rewards:
